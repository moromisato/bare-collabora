name: Prebuild
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prebuild:
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: Build / ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - run: sudo apt install gperf nasm
        if: ${{ matrix.platform == 'linux' || matrix.platform == 'android' }}
      - run: brew install autoconf automake libtool make gperf
        if: ${{ matrix.platform == 'darwin' || matrix.platform == 'ios' }}
      - run: choco install msys2
        if: ${{ matrix.platform == 'win32' }}
      - run: pacman --noconfirm -S make autoconf automake libtool gettext gettext-devel pkgconf python gperf nasm bison flex zip unzip patch
        shell: C:\tools\msys64\usr\bin\bash.exe -e {0}
        env:
          PATH: C:\tools\msys64\usr\bin
        if: ${{ matrix.platform == 'win32' }}
      - run: git config --global core.autocrlf false
        if: ${{ matrix.platform == 'win32' }}
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: ${{ matrix.flags }}
          tags: ${{ matrix.tags}}
          prefix: install/${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}/prebuilds
      - uses: holepunchto/actions/upload-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          tags: ${{ matrix.tags}}
          prefix: install
  merge:
    runs-on: ubuntu-latest
    needs: prebuild
    name: Merge
    steps:
      - uses: holepunchto/actions/merge-prebuilds@v1
